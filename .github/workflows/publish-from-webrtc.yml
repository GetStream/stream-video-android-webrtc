name: Publish from WebRTC
run-name: Publish WebRTC Android (${{ inputs.variant }}) — ${{ inputs.webrtc_release_url }}

on:
  workflow_dispatch:
    inputs:
      webrtc_release_url:
        description: "Upstream GetStream/webrtc release URL, e.g. https://github.com/GetStream/webrtc/releases/tag/145.1"
        required: true
      pre_release:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: false
      publish-targets:
        description: >-
          Leave as-is. central is a manual escape hatch for a release that has to
          go out when the Stream repository cannot take it.
        required: false
        type: choice
        options:
          - streamRepo
          - streamRepo,central
          - central
        default: streamRepo
      variant:
        description: "default publishes libwebrtc.aar as stream-video-webrtc-android. repackaged publishes libwebrtc-repackaged.aar as stream-video-webrtc-android-repackaged."
        required: false
        type: choice
        options:
          - default
          - repackaged
        default: default

permissions:
  contents: write

jobs:
  # Post a "queued for approval" Slack notification before the publish job sits behind the
  # `maven-publish` environment gate. This job is intentionally ungated so the message lands
  # immediately and reviewers know there is something to approve.
  notify-queued:
    runs-on: ubuntu-latest
    steps:
      - name: Extract upstream tag for display
        id: tag
        env:
          URL: ${{ inputs.webrtc_release_url }}
        run: |
          stripped="${URL%%[?#]*}"
          stripped="${stripped%/}"
          tag="${stripped##*/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Posted to #android so the broader team sees the gate, not just the CI channel.
      - name: Notify Slack — queued for approval
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ANDROID }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":hourglass_flowing_sand: WebRTC ${{ steps.tag.outputs.tag }} (${{ inputs.variant }}) queued for approval"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":hourglass_flowing_sand: *WebRTC `${{ steps.tag.outputs.tag }}` (`${{ inputs.variant }}`) queued for approval* for `${{ github.repository }}`"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ inputs.webrtc_release_url }}|Upstream release> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Approve in Actions>"

  publish:
    runs-on: ubuntu-latest
    environment: maven-publish
    needs: notify-queued
    outputs:
      published_version: ${{ steps.resolve_webrtc_release.outputs.published_version }}
      tag: ${{ steps.resolve_webrtc_release.outputs.tag }}
      sha: ${{ steps.commit_aar.outputs.sha }}
      artifact_id: ${{ steps.resolve_webrtc_release.outputs.artifact_id }}
      asset_name: ${{ steps.resolve_webrtc_release.outputs.asset_name }}
      release_tag: ${{ steps.resolve_webrtc_release.outputs.release_tag }}

    steps:
      # Fetch the repository with full history so the workflow can create and push commits/tags.
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install the Java toolchain required by the Gradle publish tasks.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      # Validate the upstream release URL, extract its tag, sanitize it into the base version,
      # derive the published version, and build the libwebrtc.aar download URL from the upstream tag.
      - name: Resolve WebRTC release
        id: resolve_webrtc_release
        env:
          WEBRTC_RELEASE_URL: ${{ inputs.webrtc_release_url }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          VARIANT: ${{ inputs.variant }}
        run: |
          python3 <<'PY'
          import os
          import re
          from urllib.parse import unquote, urlparse

          url = os.environ["WEBRTC_RELEASE_URL"]
          variant = os.environ["VARIANT"]
          if variant not in ("default", "repackaged"):
              raise SystemExit("variant must be default or repackaged")

          uri = urlparse(url)
          release_path = "/GetStream/webrtc/releases/tag/"

          if uri.scheme != "https" or uri.netloc != "github.com" or not uri.path.startswith(release_path):
              raise SystemExit("WebRTC release URL must be under https://github.com/GetStream/webrtc/releases/tag/")

          tag = unquote(uri.path[len(release_path):]).rstrip("/")
          if not tag or "/" in tag:
              raise SystemExit("WebRTC release URL must include a tag")

          sanitized_tag = tag.removeprefix("v")
          sanitized_tag = re.sub(r"[^0-9A-Za-z.-]+", "-", sanitized_tag).strip("-")
          if not sanitized_tag:
              raise SystemExit("WebRTC release tag could not be converted into a version")

          match = re.fullmatch(r"([0-9]+(?:\.[0-9]+){0,2})(?:-([0-9A-Za-z.-]+))?", sanitized_tag)
          if not match:
              raise SystemExit(
                  "WebRTC release tag could not be converted into a SemVer version with major.minor.patch"
              )

          core_parts = [str(int(part)) for part in match.group(1).split(".")]
          version = ".".join(core_parts + ["0"] * (3 - len(core_parts)))
          prerelease = match.group(2)
          if prerelease:
              prerelease_parts = prerelease.split(".")
              has_invalid_prerelease = any(
                  not part or (part.isdigit() and len(part) > 1 and part.startswith("0"))
                  for part in prerelease_parts
              )
              if has_invalid_prerelease:
                  raise SystemExit("WebRTC release tag prerelease suffix is not SemVer-compatible")
              version = f"{version}-{prerelease}"

          # A repackaged upstream tag is "<version>-repackaged" so it can sit beside
          # the stock release. Maven still publishes the unsuffixed version.
          if variant == "repackaged":
              if prerelease == "repackaged":
                  prerelease = None
              elif prerelease and prerelease.endswith("-repackaged"):
                  prerelease = prerelease[: -len("-repackaged")] or None
              version = ".".join(core_parts + ["0"] * (3 - len(core_parts)))
              if prerelease:
                  version = f"{version}-{prerelease}"

          published_version = version
          if os.environ["PRE_RELEASE"].lower() == "true" and not published_version.endswith("-SNAPSHOT"):
              published_version = f"{published_version}-SNAPSHOT"

          if variant == "repackaged":
              asset_name = "libwebrtc-repackaged.aar"
              artifact_id = "stream-video-webrtc-android-repackaged"
              # Distinct from the stock tag, which is the Maven version itself.
              release_tag = f"{published_version}-repackaged"
          else:
              asset_name = "libwebrtc.aar"
              artifact_id = "stream-video-webrtc-android"
              release_tag = published_version

          download_url = f"https://github.com/GetStream/webrtc/releases/download/{tag}/{asset_name}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"version={version}\n")
              output.write(f"published_version={published_version}\n")
              output.write(f"download_url={download_url}\n")
              output.write(f"asset_name={asset_name}\n")
              output.write(f"artifact_id={artifact_id}\n")
              output.write(f"release_tag={release_tag}\n")
          PY

      # Fail before downloading or publishing if this published version has already been tagged.
      - name: Check release tag does not exist
        env:
          RELEASE_TAG: ${{ steps.resolve_webrtc_release.outputs.release_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
            exit 1
          fi

      # Download the upstream Android WebRTC artifact into the local artifacts folder.
      - name: Download AAR artifact
        run: |
          mkdir -p artifacts
          curl --fail --location --show-error \
            --output "artifacts/${{ steps.resolve_webrtc_release.outputs.asset_name }}" \
            "${{ steps.resolve_webrtc_release.outputs.download_url }}"

      # Persist the downloaded AAR in this repository before running the Maven publication.
      - name: Commit AAR artifact
        id: commit_aar
        env:
          VERSION: ${{ steps.resolve_webrtc_release.outputs.published_version }}
          ASSET_NAME: ${{ steps.resolve_webrtc_release.outputs.asset_name }}
          VARIANT: ${{ inputs.variant }}
        run: |
          git add "artifacts/$ASSET_NAME"
          if [ "$VARIANT" = "repackaged" ]; then
            commit_message="Add repackaged WebRTC AAR $VERSION"
          else
            commit_message="Bump version to $VERSION"
          fi
          if git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "$commit_message"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$commit_message"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Confirm the expected AAR exists before invoking Gradle publishing tasks.
      - name: Verify AAR artifact
        run: |
          asset_name="${{ steps.resolve_webrtc_release.outputs.asset_name }}"
          if [ ! -f "./artifacts/$asset_name" ]; then
            echo "Error: $asset_name not found in artifacts directory"
            exit 1
          fi
          echo "AAR artifact found: $(ls -la "./artifacts/$asset_name")"

      # Export the sanitized version and snapshot flag for the remaining shell steps.
      - name: Set version and snapshot variables
        env:
          PUBLISH_TARGETS: ${{ inputs.publish-targets }}
        run: |
          VERSION="${{ steps.resolve_webrtc_release.outputs.version }}"
          SNAPSHOT="${{ inputs.pre_release }}"
          PUBLISHED_VERSION="${{ steps.resolve_webrtc_release.outputs.published_version }}"

          echo "version=$VERSION" >> $GITHUB_ENV
          echo "SNAPSHOT=$SNAPSHOT" >> $GITHUB_ENV
          echo "published_version=$PUBLISHED_VERSION" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_version=$VERSION" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_SNAPSHOT=$SNAPSHOT" >> $GITHUB_ENV
          # An env var rather than -P, so a value with a space cannot split into a second argument.
          echo "ORG_GRADLE_PROJECT_streamPublishTargets=$PUBLISH_TARGETS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_publishVariant=${{ inputs.variant }}" >> $GITHUB_ENV
          echo "ARTIFACT_ID=${{ steps.resolve_webrtc_release.outputs.artifact_id }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ steps.resolve_webrtc_release.outputs.release_tag }}" >> $GITHUB_ENV

          echo "Configured environment variables:"
          echo "Version: $VERSION"
          echo "Snapshot: $SNAPSHOT"
          echo "Published version: $PUBLISHED_VERSION"

      # Smoke-check that Gradle can see the configured project and derived publish values.
      - name: Verify Gradle setup
        run: |
          echo "Verifying Gradle project setup..."
          ./gradlew tasks --all | head -20
          echo ""
          echo "Project version: $published_version"
          echo "Snapshot mode: $SNAPSHOT"

      # Show the exact artifacts and coordinates Gradle is about to publish.
      - name: Print artifacts to be published
        run: |
          echo "Artifacts to be published:"
          ./gradlew printAllArtifacts

      # Publish the committed AAR and generated companion artifacts to every selected target:
      # Maven Central directly, and/or a staged tree for the Stream repository upload job.
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: true
        run: |
          echo "Version: $published_version"
          echo "Snapshot: $SNAPSHOT"

          ./gradlew publish

      # Give Maven Central a chance to serve the published artifact before tagging the release.
      - name: Wait for Maven artifact availability
        if: ${{ contains(inputs.publish-targets, 'central') }}
        run: |
          GROUP_PATH="io/getstream"
          ARTIFACT_ID="${ARTIFACT_ID}"
          TIMEOUT_SECONDS=600
          INTERVAL_SECONDS=30
          DEADLINE=$((SECONDS + TIMEOUT_SECONDS))

          if [ "$SNAPSHOT" == "true" ]; then
            MAVEN_URL="https://central.sonatype.com/repository/maven-snapshots/$GROUP_PATH/$ARTIFACT_ID/$published_version/maven-metadata.xml"
            echo "Waiting for snapshot metadata: $MAVEN_URL"
          else
            MAVEN_URL="https://repo1.maven.org/maven2/$GROUP_PATH/$ARTIFACT_ID/$published_version/$ARTIFACT_ID-$published_version.aar"
            echo "Waiting for release artifact: $MAVEN_URL"
          fi

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if [ "$SNAPSHOT" == "true" ]; then
              if curl --fail --silent --show-error "$MAVEN_URL" | grep -q "<extension>aar</extension>"; then
                echo "Maven snapshot artifact is available."
                exit 0
              fi
            elif curl --fail --silent --show-error --head "$MAVEN_URL" >/dev/null; then
              echo "Maven release artifact is available."
              exit 0
            fi

            echo "Artifact is not available yet. Retrying in $INTERVAL_SECONDS seconds..."
            sleep "$INTERVAL_SECONDS"
          done

          echo "::warning::Timed out after $TIMEOUT_SECONDS seconds waiting for Maven artifact availability."
          echo "Continuing because Maven Central sync can occasionally take longer."

      # Handed to a job that has never seen the signing key -- the reason Gradle stages to a
      # directory instead of writing to the bucket itself.
      - name: Hand the staged tree to the upload job
        if: ${{ contains(inputs.publish-targets, 'streamRepo') }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-repo-staged
          path: build/staged-repo
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack on publish failure
        if: failure()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: WebRTC publish failed for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *WebRTC publish failed* for `${{ github.repository }}`"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ inputs.webrtc_release_url }}|Upstream release> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  # Separate job: secrets are injected per job, so this one holds the R2 credential and never the
  # signing key, and the publish job holds the signing key and never the R2 credential.
  upload:
    needs: publish
    if: ${{ contains(inputs.publish-targets, 'streamRepo') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the staged tree
        uses: actions/download-artifact@v4
        with:
          name: stream-repo-staged
          path: build/staged-repo

      - name: Publish to the Stream repository
        uses: GetStream/stream-build-conventions-android/.github/actions/publish-to-stream-repo@v1.0.1
        with:
          staged-directory: build/staged-repo
          channel: ${{ inputs.pre_release && 'snapshots' || 'releases' }}
          endpoint: ${{ secrets.STREAM_REPO_ENDPOINT }}
          bucket: ${{ secrets.STREAM_REPO_BUCKET }}
          access-key-id: ${{ secrets.STREAM_REPO_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.STREAM_REPO_SECRET_ACCESS_KEY }}

      - name: Notify Slack on upload failure
        if: failure()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: WebRTC ${{ needs.publish.outputs.published_version }} upload to the Stream repository failed for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    :x: *WebRTC `${{ needs.publish.outputs.published_version }}` upload to the Stream repository failed* for `${{ github.repository }}`
                    The AAR commit is pushed but no GitHub release was created. Re-run the failed job within a day, while the staged tree is still kept.
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  # The GitHub release (and its tag) only once the artifact is actually resolvable: after the
  # upload when the Stream repository is a target, straight after publish when it is not.
  release:
    needs: [publish, upload]
    if: >-
      ${{ always()
          && needs.publish.result == 'success'
          && (needs.upload.result == 'success' || needs.upload.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.published_version }}
      UPSTREAM_TAG: ${{ needs.publish.outputs.tag }}
      PRE_RELEASE: ${{ inputs.pre_release }}
      TARGETS: ${{ inputs.publish-targets }}
      ARTIFACT_ID: ${{ needs.publish.outputs.artifact_id }}
      ASSET_NAME: ${{ needs.publish.outputs.asset_name }}
      RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}

      # Publish a GitHub release for the committed AAR. The release tag is created as part of this step.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRE_RELEASE" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          : > notes.md
          # Customers need one line of setup to see a version that is not on Central.
          if [ "$TARGETS" == "streamRepo" ]; then
            cat > notes.md <<EOF
          > [!IMPORTANT]
          > **\`$ARTIFACT_ID:$VERSION\` is published to the Stream Maven repository, not Maven Central.**
          >
          > \`\`\`kotlin
          > // settings.gradle.kts
          > dependencyResolutionManagement {
          >     repositories {
          >         google()
          >         mavenCentral()
          >         maven("https://stream-io-repo.com")
          >     }
          > }
          > \`\`\`

          EOF
          fi
          printf '%s\n\n%s\n' \
            "Built from upstream [GetStream/webrtc@${UPSTREAM_TAG}](https://github.com/GetStream/webrtc/releases/tag/${UPSTREAM_TAG})." \
            "Maven coordinate: \`io.getstream:${ARTIFACT_ID}:${VERSION}\`" >> notes.md

          gh release create "$RELEASE_TAG" \
            "artifacts/$ASSET_NAME" \
            --title "$RELEASE_TAG" \
            --target "${{ needs.publish.outputs.sha }}" \
            --notes-file notes.md \
            $PRERELEASE_FLAG

      - name: Verify publication
        run: |
          echo "Publication completed successfully!"
          echo "Published artifact: io.getstream:$ARTIFACT_ID:$VERSION"
          echo "Targets: $TARGETS"
          if [[ "$TARGETS" == *streamRepo* ]]; then
            echo "Stream repository: https://browse.stream-io-repo.com/"
          fi
          if [[ "$TARGETS" == *central* ]]; then
            echo "Maven Central: https://central.sonatype.com/artifact/io.getstream/$ARTIFACT_ID/$VERSION"
          fi

      - name: Notify Slack on publish success
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":android: Released ${{ needs.publish.outputs.artifact_id }} ${{ needs.publish.outputs.published_version }} for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":rocket: *Released `${{ needs.publish.outputs.artifact_id }}:${{ needs.publish.outputs.published_version }}`* for `${{ github.repository }}` to `${{ inputs.publish-targets }}`"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.publish.outputs.release_tag }}|Release notes> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"

      - name: Notify Slack on release failure
        if: failure()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ":x: WebRTC ${{ needs.publish.outputs.published_version }} is published but the GitHub release failed for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *WebRTC `${{ needs.publish.outputs.published_version }}` is published but the GitHub release failed* for `${{ github.repository }}`"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
